<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIXIL在庫</title>
<style>
:root{
  --bg:#E9EDF0; --panel:#FFFFFF; --ink:#16212B; --sub:#5B6B79; --line:#D3DAE0;
  --in:#2D7A4C; --out:#B23F2B; --adj:#6F6420; --inv:#1F5A8C; --mute:#A7B2BC;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  -webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #4A90D9;outline-offset:2px}

/* ヘッダー */
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 12px 8px}
.top{display:flex;gap:8px;align-items:center}
h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap}
#q{flex:1;min-width:0;font-size:18px;padding:10px 12px;border:0;border-radius:8px;background:#fff;color:var(--ink)}
#reload{border:1px solid #ffffff55;background:none;color:#fff;border-radius:8px;padding:9px 10px;font-size:14px}
#reload:disabled{opacity:.4}
.bar{display:flex;gap:6px;margin-top:8px;align-items:center;overflow-x:auto}
.chip{border:1px solid #ffffff55;background:none;color:#fff;padding:5px 12px;border-radius:999px;font-size:14px;white-space:nowrap}
.chip.on{background:#fff;color:var(--ink);border-color:#fff}
#count{margin-left:auto;font-size:13px;color:#C9D3DB;white-space:nowrap}

/* 一覧 */
#list{list-style:none;margin:0;padding:0}
#list li{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--panel);border-bottom:1px solid var(--line);cursor:pointer}
#list li:active{background:#F2F5F7}
.hb{font-size:17px;font-weight:700;letter-spacing:.01em;word-break:break-all}
.meta{font-size:13px;color:var(--sub);margin-top:2px}
.qty{margin-left:auto;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:2.5ch;line-height:1}
.qty.zero{color:var(--mute)}
.qty.neg{color:var(--out)}
.tag{font-size:12px;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:2px}
.tag.欠品{background:#F6DAD4;color:var(--out)}
.tag.不足{background:#F5E9C8;color:#7A5A00}
#list li.grp{background:#DCE2E7;font-weight:700;font-size:17px;padding:13px 14px;border-bottom:1px solid #C5CDD4;position:sticky;top:var(--hdr,98px);z-index:2}
#list li.grp:active{background:#CFD6DC}
.caret{display:inline-block;width:1em;transition:transform .12s;color:var(--sub)}
.grp.open .caret{transform:rotate(90deg)}
.gmeta{margin-left:auto;font-size:13px;font-weight:400;color:var(--sub)}
.empty{padding:40px 16px;text-align:center;color:var(--sub);cursor:default!important}

/* 登録シート */
#mask{position:fixed;inset:0;background:#0007;opacity:0;pointer-events:none;transition:opacity .15s;z-index:10}
#mask.on{opacity:1;pointer-events:auto}
#sheet,#adm{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--panel);border-radius:14px 14px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;
  transform:translateY(105%);transition:transform .18s ease-out;max-height:92vh;overflow-y:auto}
#sheet.on,#adm.on{transform:none}
.sh-head{display:flex;gap:12px;align-items:flex-start}
.now{margin-left:auto;text-align:right}
.now b{display:block;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.now small{font-size:12px;color:var(--sub)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:16px 0 12px}
.seg button{padding:12px 0;font-size:16px;font-weight:700;border:2px solid var(--line);background:#fff;border-radius:10px;color:var(--sub)}
.seg button.on[data-t="入庫"]{background:var(--in);border-color:var(--in);color:#fff}
.seg button.on[data-t="出庫"]{background:var(--out);border-color:var(--out);color:#fff}
.seg button.on[data-t="調整"]{background:var(--adj);border-color:var(--adj);color:#fff}
.seg button.on[data-t="棚卸"]{background:var(--inv);border-color:var(--inv);color:#fff}
.step{display:grid;grid-template-columns:72px 1fr 72px;gap:8px}
.step button{font-size:30px;border:0;border-radius:10px;background:#E4E9ED;height:64px}
#num{font-size:34px;font-weight:700;text-align:center;border:2px solid var(--line);border-radius:10px;width:100%;font-variant-numeric:tabular-nums}
#preview{text-align:center;margin:10px 0 12px;font-size:16px;color:var(--sub);font-variant-numeric:tabular-nums}
#preview.neg{color:var(--out);font-weight:700}
.row2{display:grid;grid-template-columns:110px 1fr;gap:8px}
.row2 select,.row2 input{padding:11px 10px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:16px;min-width:0}
#save{width:100%;margin-top:12px;padding:16px;border:0;border-radius:10px;font-size:19px;font-weight:700;color:#fff;background:var(--in)}
#sheet[data-t="出庫"] #save{background:var(--out)}
#sheet[data-t="調整"] #save{background:var(--adj)}
#sheet[data-t="棚卸"] #save{background:var(--inv)}
#cancel{width:100%;margin-top:6px;padding:10px;border:0;background:none;color:var(--sub);font-size:15px}
details{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
summary{font-size:14px;color:var(--sub);padding:6px 0}
#hlist{list-style:none;margin:0;padding:0;font-size:14px}
#hlist li{display:grid;grid-template-columns:82px 36px 72px 1fr;gap:6px;padding:6px 0;border-bottom:1px solid #EEF1F3}
.fix{grid-column:1/-1;justify-self:end;border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;font-size:13px;color:var(--sub)}
.pend{grid-column:1/-1;justify-self:end;font-style:normal;font-size:13px;color:#7A5A00;background:#F5E9C8;padding:2px 8px;border-radius:4px}
#hlist li.fixform{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#F4F6F8;padding:8px;border-radius:8px}
.fixform input{padding:8px;border:2px solid var(--line);border-radius:8px;font-size:16px;min-width:0}
.fixform .fq{width:80px}.fixform .fr{flex:1 1 140px}
.fixform button{padding:8px 12px;border:0;border-radius:8px;font-size:15px}
.fixform .go{background:var(--ink);color:#fff}
#reqBtn{border:1px solid #ffffff55;background:none;color:#fff;padding:5px 12px;border-radius:999px;font-size:14px;white-space:nowrap}
#reqN{display:inline-block;min-width:1.4em;margin-left:4px;padding:0 5px;border-radius:999px;background:#E8A33A;color:#16212B;font-weight:700;font-size:12px}
#reqN:empty{display:none}
.adm-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.adm-h h2{font-size:18px;margin:0}
#alist{list-style:none;margin:0;padding:0}
#alist li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
#alist .chg{font-size:18px;font-weight:700;margin:4px 0;font-variant-numeric:tabular-nums}
#alist .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
#alist .btns button{padding:11px;border:0;border-radius:8px;font-size:16px;font-weight:700}
#alist .ok{background:var(--in);color:#fff}#alist .ng{background:#E4E9ED}
#hlist .q{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}

/* トースト */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;
  border-radius:8px;font-size:15px;opacity:0;transition:.2s;z-index:20;max-width:90vw;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--out)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>LIXIL在庫</h1>
    <input id="q" type="search" placeholder="品番で検索（例 3186L）" autocomplete="off">
    <button id="reload" title="最新の在庫を読み込む">更新</button>
  </div>
  <div class="bar" id="chips">
    <button class="chip on" data-f="all">すべて</button>
    <button class="chip" data-f="stock">在庫あり</button>
    <button class="chip" data-f="zero">在庫0</button>
    <button class="chip" data-f="short">不足</button>
    <button id="reqBtn">変更依頼<span id="reqN"></span></button>
    <span id="count"></span>
  </div>
</header>

<ul id="list"></ul>

<div id="mask"></div>
<section id="sheet" data-t="入庫" aria-hidden="true">
  <div class="sh-head">
    <div><div id="sHb" class="hb"></div><div id="sMeta" class="meta"></div></div>
    <div class="now"><b id="sQty"></b><small>現在の在庫</small></div>
  </div>
  <div class="seg" id="seg">
    <button data-t="入庫" class="on">入庫</button>
    <button data-t="出庫">出庫</button>
    <button data-t="調整">調整</button>
    <button data-t="棚卸">棚卸</button>
  </div>
  <div class="step">
    <button id="minus" aria-label="1減らす">−</button>
    <input id="num" type="number" inputmode="numeric" value="1">
    <button id="plus" aria-label="1増やす">＋</button>
  </div>
  <div id="preview"></div>
  <div class="row2">
    <select id="staff"></select>
    <input id="note" placeholder="備考（現場名など）">
  </div>
  <button id="save">入庫を登録</button>
  <button id="cancel">閉じる</button>
  <details id="hist"><summary>この品番の最近の履歴</summary><ul id="hlist"></ul></details>
</section>

<section id="adm" aria-hidden="true">
  <div class="adm-h"><h2>変更依頼の承認</h2><span id="aStaff" class="meta"></span></div>
  <ul id="alist"></ul>
  <button id="admClose" style="width:100%;padding:10px;border:0;background:none;color:var(--sub);font-size:15px">閉じる</button>
</section>

<div id="toast"></div>

<script>
/* ===== 設定：デプロイ後にここを書き換える ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxGTvehfVox-Jbh9Fr3hgt8xjyfWxwz3iKwddnN_Wv1BGHUgrt01kMxn-XbhcQqn2kv/exec';
const API_KEY = 'yasumoku-zaiko';   /* Code.gs の API_KEY と同じ文字列 */
/* ============================================ */

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
  .toUpperCase().replace(/[\s\-\/]/g, '');
const CACHE_KEY = 'zaiko_cache_v1';

let items = [], byId = {}, filter = 'all', cur = null, type = '入庫', lastLoad = 0, staffList = [];

/* 通信 */
async function apiGet(params){
  const q = new URLSearchParams(Object.assign({}, params, { key: API_KEY }));
  const r = await fetch(API_URL + '?' + q.toString());
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
async function apiPost(body){
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({}, body, { key: API_KEY })) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
function saveCache(){
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ items, staff: staffList })); } catch(e) {}
}

function prep(list){
  items = list.map(it => (it.key = norm(it.hb + ' ' + it.cat), it));
  byId = {}; items.forEach(it => byId[it.id] = it);
}
function judge(it){
  if (it.stock <= 0) return '欠品';
  if (it.target != null && it.stock < it.target) return '不足';
  return '';
}
function pass(it){
  if (filter === 'stock') return it.stock > 0;
  if (filter === 'zero') return it.stock <= 0;
  if (filter === 'short') return it.target != null && it.stock < it.target;
  return true;
}

const openGroups = new Set();
try { JSON.parse(localStorage.getItem('zaiko_groups') || '[]').forEach(g => openGroups.add(g)); } catch(e) {}
const grpOf = it => it.hb.slice(0, 4);

function rowHtml(it){
  const j = judge(it);
  const cls = it.stock < 0 ? 'neg' : it.stock === 0 ? 'zero' : '';
  return `<li data-id="${esc(it.id)}">
    <div><div class="hb">${esc(it.hb)}${j && j !== '欠品' ? `<span class="tag ${j}">${j}</span>` : ''}</div>
    <div class="meta">${esc(it.cat)}　${esc(it.w)}×${esc(it.h)}${it.target != null ? '　適正 ' + it.target : ''}</div></div>
    <div class="qty ${cls}">${it.stock}</div></li>`;
}

function render(){
  const q = norm($('#q').value);
  const rows = items.filter(it => (!q || it.key.includes(q)) && pass(it));
  $('#count').textContent = rows.length + '件';
  if (!rows.length) {
    $('#list').innerHTML = '<li class="empty">該当する品番がありません。検索語を短くするか、絞り込みを「すべて」にしてください。</li>';
    return;
  }
  const groups = new Map();
  rows.forEach(it => { const g = grpOf(it); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(it); });
  const keys = [...groups.keys()].sort();
  let html = '';
  keys.forEach(g => {
    const list = groups.get(g);
    const open = q ? true : openGroups.has(g);
    const total = list.reduce((s, it) => s + Math.max(0, it.stock), 0);
    html += `<li class="grp${open ? ' open' : ''}" data-g="${esc(g)}"><span class="caret">▸</span>${esc(g)}<span class="gmeta">${list.length}品番　在庫計 ${total}</span></li>`;
    if (open) html += list.map(rowHtml).join('');
  });
  $('#list').innerHTML = html;
}
function toggleGroup(g){
  if ($('#q').value) return;
  openGroups.has(g) ? openGroups.delete(g) : openGroups.add(g);
  try { localStorage.setItem('zaiko_groups', JSON.stringify([...openGroups])); } catch(e) {}
  render();
}

/* 登録シート */
function openSheet(it){
  cur = it;
  $('#sHb').textContent = it.hb;
  $('#sMeta').textContent = `${it.cat}　${it.w}×${it.h}`;
  $('#sQty').textContent = it.stock;
  $('#num').value = 1;
  $('#note').value = '';
  $('#hist').open = false;
  $('#hlist').innerHTML = '';
  $('#hlist').dataset.id = '';
  setType('入庫');
  $('#mask').classList.add('on');
  $('#sheet').classList.add('on');
  $('#sheet').setAttribute('aria-hidden', 'false');
}
function closeSheet(){
  $('#mask').classList.remove('on');
  $('#sheet').classList.remove('on');
  $('#sheet').setAttribute('aria-hidden', 'true');
}
function setType(t){
  type = t;
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  $('#sheet').dataset.t = t;
  if (t === '棚卸') $('#num').value = cur.stock < 0 ? 0 : cur.stock;
  else if (t !== '調整' && !(parseInt($('#num').value, 10) >= 1)) $('#num').value = 1;
  update();
}
function delta(){
  const n = parseInt($('#num').value, 10) || 0;
  if (type === '棚卸') return n - cur.stock;
  return type === '出庫' ? -n : n;
}
function update(){
  const after = cur.stock + delta();
  const p = $('#preview');
  if (type === '棚卸') {
    const d = after - cur.stock;
    p.textContent = `帳簿 ${cur.stock} → 実数 ${after}（差異 ${d > 0 ? '+' : ''}${d}）`;
  } else {
    p.textContent = `登録後の在庫　${cur.stock} → ${after}`;
  }
  p.classList.toggle('neg', after < 0);
  $('#save').textContent = `${type}を登録`;
}
function step(d){
  const min = type === '調整' ? -9999 : type === '棚卸' ? 0 : 1;
  $('#num').value = Math.max(min, (parseInt($('#num').value, 10) || 0) + d);
  update();
}

function save(){
  const qty = parseInt($('#num').value, 10);
  if (isNaN(qty)) return toast('数量を入力してください', true);
  if (type === '棚卸' && qty < 0) return toast('棚卸数量は0以上にしてください', true);
  if ((type === '入庫' || type === '出庫') && qty < 1) return toast('入庫・出庫の数量は1以上にしてください', true);
  if (type === '調整' && qty === 0) return toast('調整数量を入力してください', true);
  const it = cur, d = delta(), after = it.stock + d;
  if (after < 0 && !confirm(`在庫が ${after} になります。登録しますか？`)) return;

  const staff = $('#staff').value, note = $('#note').value.trim(), t = type;
  try { localStorage.setItem('zaiko_staff', staff); } catch(e) {}

  /* 先に画面へ反映（待ち時間ゼロ）→ 裏でシートへ保存 */
  it.stock = after;
  closeSheet(); render(); saveCache();
  toast(`${t}を登録中…`);

  apiPost({ id: it.id, type: t, qty, staff, note })
    .then(r => { it.stock = r.stock; render(); saveCache(); toast(`${t}を登録しました　${it.hb}：${r.stock}`); })
    .catch(e => { it.stock -= d; render(); saveCache(); toast(`登録できませんでした：${e.message}`, true); });
}

function loadHistory(){
  if (!$('#hist').open || $('#hlist').dataset.id === cur.id) return;
  const id = cur.id;
  $('#hlist').innerHTML = '<li>読み込み中…</li>';
  apiGet({ action: 'history', id })
    .then(rows => {
      $('#hlist').dataset.id = id;
      $('#hlist').innerHTML = rows.length ? rows.map(r =>
        `<li><span>${esc(r.d)}</span><span>${esc(r.t)}</span><span class="q">${esc(r.q)}</span><span>${esc(r.s)} ${esc(r.n)}</span>${
          r.pend ? '<em class="pend">変更依頼中</em>'
                 : `<button class="fix" data-rec="${esc(r.rec)}" data-q="${esc(r.qr)}" data-t="${esc(r.t)}">修正を依頼</button>`}</li>`
      ).join('') : '<li>この品番の履歴はまだありません</li>';
    })
    .catch(e => $('#hlist').innerHTML = `<li>履歴を読み込めませんでした：${esc(e.message)}</li>`);
}

function start(boot){
  staffList = boot.staff || [];
  const sel = $('#staff'), keep = sel.value;
  sel.innerHTML = staffList.map(s => `<option>${esc(s)}</option>`).join('');
  let pick = keep;
  if (!pick) { try { pick = localStorage.getItem('zaiko_staff'); } catch(e) {} }
  if (pick && staffList.includes(pick)) sel.value = pick;
  prep(boot.items || []);
  render();
}

function reload(silent, fresh){
  $('#reload').disabled = true;
  apiGet(fresh ? { action: 'boot', fresh: '1' } : { action: 'boot' })
    .then(d => {
      start(d); saveCache(); lastLoad = Date.now(); refreshReqCount();
      if (!silent) toast('最新の在庫を読み込みました');
    })
    .catch(e => toast(`読み込めませんでした：${e.message}`, true))
    .finally(() => { $('#reload').disabled = false; });
}

/* ===== 変更依頼 ===== */
function openFixForm(btn){
  document.querySelectorAll('#hlist .fixform').forEach(f => f.remove());
  const li = btn.closest('li');
  const t = btn.dataset.t;
  const f = document.createElement('li');
  f.className = 'fixform';
  f.innerHTML = `<span class="meta">${esc(t)}の正しい数量</span>
    <input class="fq" type="number" inputmode="numeric" value="${esc(btn.dataset.q)}">
    <input class="fr" placeholder="理由（例 数え間違い）">
    <button class="go">依頼する</button><button class="no">やめる</button>`;
  li.after(f);
  f.querySelector('.fq').select();
  f.querySelector('.no').onclick = () => f.remove();
  f.querySelector('.go').onclick = () => sendFix(btn.dataset.rec, btn.dataset.q, t, f);
}
function sendFix(rec, oldQ, t, f){
  const v = f.querySelector('.fq').value.trim(), reason = f.querySelector('.fr').value.trim();
  const n = parseInt(v, 10);
  if (v === '' || isNaN(n)) return toast('正しい数量を入力してください', true);
  if (t !== '調整' && n < 0) return toast('数量は0以上にしてください', true);
  if (String(n) === String(oldQ)) return toast('元の数量と同じです', true);
  if (!reason) return toast('理由を入力してください', true);
  const go = f.querySelector('.go'); go.disabled = true; go.textContent = '送信中…';
  apiPost({ action: 'request', recId: rec, newQty: n, reason, staff: $('#staff').value })
    .then(() => {
      toast('変更依頼を送りました。承認されると在庫に反映されます');
      $('#hlist').dataset.id = ''; loadHistory(); refreshReqCount();
    })
    .catch(e => { go.disabled = false; go.textContent = '依頼する'; toast(`依頼できませんでした：${e.message}`, true); });
}

let adminPin = '';
function refreshReqCount(){
  apiGet({ action: 'requests' })
    .then(list => { $('#reqN').textContent = list.length || ''; if ($('#adm').classList.contains('on')) renderReqs(list); })
    .catch(() => {});
}
function openAdmin(){
  try { adminPin = localStorage.getItem('zaiko_pin') || ''; } catch(e) {}
  if (!adminPin) {
    adminPin = (prompt('管理者PINを入力してください') || '').trim();
    if (!adminPin) return;
  }
  $('#aStaff').textContent = '処理者：' + $('#staff').value;
  $('#alist').innerHTML = '<li>読み込み中…</li>';
  $('#mask').classList.add('on');
  $('#adm').classList.add('on');
  $('#adm').setAttribute('aria-hidden', 'false');
  refreshReqCount();
}
function closeAdmin(){
  $('#adm').classList.remove('on');
  $('#adm').setAttribute('aria-hidden', 'true');
  if (!$('#sheet').classList.contains('on')) $('#mask').classList.remove('on');
}
function renderReqs(list){
  $('#alist').innerHTML = list.length ? list.map(r => `<li data-req="${esc(r.reqId)}">
    <div class="hb">${esc(r.hb)}</div>
    <div class="chg">${esc(r.t)}　${esc(r.from)} → ${esc(r.to)}</div>
    <div class="meta">理由：${esc(r.reason)}</div>
    <div class="meta">${esc(r.by)}　${esc(r.d)}　${esc(r.recId)}</div>
    <div class="btns"><button class="ok">承認して反映</button><button class="ng">却下</button></div></li>`).join('')
    : '<li class="meta">未処理の変更依頼はありません</li>';
}
function decide(li, decision){
  li.querySelectorAll('button').forEach(b => b.disabled = true);
  apiPost({ action: 'approve', reqId: li.dataset.req, decision, pin: adminPin, staff: $('#staff').value })
    .then(r => {
      try { localStorage.setItem('zaiko_pin', adminPin); } catch(e) {}
      if (r.id && byId[r.id]) { byId[r.id].stock = r.stock; render(); saveCache(); }
      li.remove();
      const left = document.querySelectorAll('#alist li[data-req]').length;
      if (!left) renderReqs([]);
      $('#reqN').textContent = left || '';
      toast(decision === '承認' ? `承認しました${r.id ? '　在庫：' + r.stock : ''}` : '却下しました');
    })
    .catch(e => {
      li.querySelectorAll('button').forEach(b => b.disabled = false);
      if (/PIN/.test(e.message)) { adminPin = ''; try { localStorage.removeItem('zaiko_pin'); } catch(x) {} closeAdmin(); }
      toast(`処理できませんでした：${e.message}`, true);
    });
}

let tt;
function toast(msg, err){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.toggle('err', !!err);
  el.classList.add('on');
  clearTimeout(tt);
  tt = setTimeout(() => el.classList.remove('on'), err ? 4000 : 2000);
}

/* 初期化：前回のデータで即表示 → 裏で最新に更新 */
(function init(){
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch(e) {}
  if (cached && cached.items) start(cached);
  else $('#count').textContent = '読み込み中…';
  reload(true);
})();

$('#q').addEventListener('input', render);
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b));
  render();
});
$('#list').addEventListener('click', e => {
  const g = e.target.closest('li.grp'); if (g) return toggleGroup(g.dataset.g);
  const li = e.target.closest('li[data-id]'); if (li) openSheet(byId[li.dataset.id]);
});
const fitHeader = () => document.documentElement.style.setProperty('--hdr', document.querySelector('header').offsetHeight + 'px');
fitHeader(); window.addEventListener('resize', fitHeader);
$('#seg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setType(b.dataset.t); });
$('#minus').addEventListener('click', () => step(-1));
$('#plus').addEventListener('click', () => step(1));
$('#num').addEventListener('input', update);
$('#num').addEventListener('focus', e => e.target.select());
$('#save').addEventListener('click', save);
$('#cancel').addEventListener('click', closeSheet);
$('#mask').addEventListener('click', () => { closeSheet(); closeAdmin(); });
$('#hlist').addEventListener('click', e => { const b = e.target.closest('.fix'); if (b) openFixForm(b); });
$('#reqBtn').addEventListener('click', openAdmin);
$('#admClose').addEventListener('click', closeAdmin);
$('#alist').addEventListener('click', e => {
  const li = e.target.closest('li[data-req]'); if (!li) return;
  if (e.target.closest('.ok')) decide(li, '承認');
  else if (e.target.closest('.ng') && confirm('この依頼を却下しますか？')) decide(li, '却下');
});
$('#hist').addEventListener('toggle', loadHistory);
$('#reload').addEventListener('click', () => reload(false, true));
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSheet(); closeAdmin(); } });
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && Date.now() - lastLoad > 60000) reload(true);
});
</script>
</body>
</html>
